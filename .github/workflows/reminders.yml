name: Напоминания по расписанию

on:
  schedule:
    - cron: "7 * * * *" # каждый час в :07 по UTC
  workflow_dispatch: # можно запустить вручную на вкладке Actions

permissions:
  contents: write # чтобы сохранять sent.json

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyYAML
        run: pip install --quiet pyyaml

      - name: Проверить и отправить напоминания
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_reminders.py

      - name: Сохранить отметки об отправке
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- sent.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent.json
            git commit -m "Отметки об отправленных напоминаниях"
            git pull --rebase
            git push
          fi
