# Напоминания для Telegram-бота.
#
# Часовой пояс — смещение от UTC в часах (GMT+7).
utc_offset: 7

# Как добавить напоминание — скопируй блок и поменяй поля:
#   name    — уникальное название (обязательно)
#   time    — время, ВСЕГДА в кавычках: "09:00"
#   и один из вариантов:
#     date: 2026-11-08     — один раз в этот день
#     weekly: [sun]        — по дням недели: mon tue wed thu fri sat sun
#     daily: true          — каждый день
#   from / until — с какой и до какой даты действует повторяющееся (необязательно)
#   enabled: false — временно выключить (необязательно)
#   text    — текст сообщения
#
# Бот проверяет этот файл раз в час, поэтому сообщение приходит в течение часа
# после указанного времени (обычно через 5–30 минут).

reminders:
  - name: Воскресные замеры
    weekly: [sun]
    time: "09:00"
    until: 2027-01-10
    text: |
      Воскресные замеры 📏
      • талия на уровне пупка, натощак, живот не втягивать
      • средний утренний вес за неделю
      • рабочие веса: жим лёжа, тяга в наклоне, тяга вниз
      Пришли цифры в чат с дневником питания.

  - name: Рекомпозиция — первая проверка
    date: 2026-11-08
    time: "09:00"
    text: |
      Первая проверка — подстройка калорий:
      • вес и талия растут → минус 200 ккал
      • вес падает больше чем на 0,5 кг в неделю → плюс 200 ккал
      • вес стоит, талия уменьшается → ничего не меняем

  - name: Рекомпозиция — промежуточная проверка
    date: 2026-11-29
    time: "09:00"
    text: |
      Промежуточная проверка: уменьшается ли талия и растут ли рабочие веса.
      Сделай фото спереди, сбоку и со спины при том же свете, что и раньше.

  - name: Рекомпозиция — фото за месяц
    date: 2026-12-27
    time: "09:00"
    text: Ежемесячные фото спереди, сбоку и со спины 📸

  - name: Рекомпозиция — итог 12 недель
    date: 2027-01-10
    time: "09:00"
    text: |
      Итог 12 недель рекомпозиции 🎯
      Сделай фото и реши, что дальше: продолжать, короткая сушка на 6–8 недель
      (около 2300 ккал) или медленный набор.

  - name: Четверг — статья, блок 1
    date: 2026-10-22
    time: "11:00"
    text: |
      Четверг — день статьи ✍️
      • сырники (если ещё не сделал)
      • блок 1: 1,5 часа на статью. Первые 30 минут — план теории: разделы и что в каждом
      • зал в 16–17
      • после зала блок 2
      • вечер свободен, без чувства вины

  - name: Четверг — статья, блок 2
    date: 2026-10-22
    time: "18:30"
    text: |
      После зала — блок 2 по статье, 1,5 часа 💪
      Потом вечер твой.
